[project]
name = "bandit-stor"
version = "0.1.0"
description = "Research prototype for Sparse Tsallis offline contextual-bandit recommendation"
readme = "README.md"
license = {text = "MIT"}
keywords = ["contextual-bandits", "off-policy-evaluation", "recommender-systems", "sparsemax", "tsallis-entropy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
  "torch",
  "numpy",
  "polars",
  "scikit-learn",
  "hydra-core",
  "omegaconf",
  "tqdm",
  "rich",
  "pyyaml",
  "optuna",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "black",
  "mypy",
]
obp = [
  "obp",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]
