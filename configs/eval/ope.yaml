metrics:
  - ips
  - snips
  - doubly_robust
  - effective_sample_size
  - max_importance_weight
  - logged_action_coverage
  - unsupported_action_mass
  - alpha_divergence
  - sparse_support_size
  - tsallis_entropy
  - dr_lift

confidence_intervals:
  enabled: true
  bootstrap_samples: 500
  confidence_level: 0.95

mode: reward_aggressive

robust_estimators:
  switch_tau: 25.0
  dros_lambda: 1.0
  dros_lambdas: [0.1, 0.3, 1.0, 3.0, 10.0, 30.0, 100.0]

cross_fitting:
  enabled: true
  folds: 2
  seed: 42

reward_sanity:
  prediction_mean_max_multiple_of_base_rate: 5.0
  prediction_mean_min_multiple_of_base_rate: 0.2
  log_loss_must_not_exceed_constant_by_more_than: 0.005
  ece_max: 0.01
  auc_pr_lift_min: 1.05
  auc_roc_min: 0.60
  top_decile_lift_min: 1.0

gates:
  hard:
    min_eval_n: 50000
    max_importance_weight_catastrophic: 40.0
    ess_ratio_catastrophic_min: 0.10
    max_lift_disagreement: 0.002
    unsupported_action_mass_max: 0.01
  preferred:
    max_importance_weight: 30.0
    ess_ratio: 0.20
    alpha_divergence: 6.0
  sparsity:
    min_avg_support_size: 5
    max_avg_support_size: 50
    max_entropy_ratio: 0.99
    min_entropy_ratio: 0.20
  bootstrap:
    min_dr_lift_p05: 0.0

modes:
  reward_aggressive:
    preferred:
      max_importance_weight: 30.0
      ess_ratio: 0.20
      alpha_divergence: 6.0
    sparsity:
      max_avg_support_size: 50
    bootstrap:
      min_dr_lift_p05: 0.0
  deployment_conservative:
    preferred:
      max_importance_weight: 15.0
      ess_ratio: 0.20
      alpha_divergence: 2.0
    sparsity:
      max_avg_support_size: 50
    bootstrap:
      min_dr_lift_p05: 0.0
